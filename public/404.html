<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AMUSU Elections - Candidate Profile</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages router redirect
      // This script takes the current URL path and encodes it into a query parameter
      // so index.html can instantly restore the correct route (e.g. /candidate/pres-1) without 404ing.
      var l = window.location;
      var pathSegmentsToKeep = 0;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?p=/' + encodeURIComponent(redirectPath) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;

      window.location.replace(newUrl);
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #059669;">
    <div style="text-align: center;">
      <h3 style="margin-bottom: 8px; font-weight: 800;">AMUSU Elections Portal</h3>
      <p style="font-size: 13px; color: #475569;">Loading shared candidate profile...</p>
    </div>
  </body>
</html>
