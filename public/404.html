<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AMUSU Elections - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages routing
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #475569;">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 8px; color: #059669;">AMUSU Elections Portal</h2>
      <p style="font-size: 14px;">Directing you to page...</p>
    </div>
  </body>
</html>
